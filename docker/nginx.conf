server {
    listen 80 default_server;
    server_name _;

    root /app;
    index bot.php;

    location = / {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index bot.php;
        fastcgi_param SCRIPT_FILENAME $document_root/bot.php;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    location = /bot.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index bot.php;
        fastcgi_param SCRIPT_FILENAME $document_root/bot.php;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    location ~ /\.(ht|env|git) {
        deny all;
    }

    location ~ /(data|vendor|src)/ {
        deny all;
    }
}